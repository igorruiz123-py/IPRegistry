<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPRegistry Console</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="assets/ipregistry-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <section class="heading">
        <header>
            <div class="logo">
                <img src="assets/ipregistry-logo.png" alt="IPRegistry Logo">
            </div>
            <div class="title">
                <p>
                    <b>IP Address Management Console for IT Infrastructure Teams</b>
                </p>
            </div>
            <nav>
                <h1 id="login">
                    <a href="index.html"><b>Home</b></a>
                </h1>
                <h1 id="login">
                    <a href="login.html"><b>Login</b></a>
                </h1>
            </nav>
        </header>
    </section>
    <main>
        <section class="login">
            <header class="main-heading">
                <div class="main-logo">
                    <img src="assets/ipregistry-logo.png" alt="IPRegistry Logo">
                </div>
                <div class="main-title">
                    <h1>Please authenticate your account</h1>
                </div>
            </header>
            <div class="main-form">
                <form action="#" method="post">
                    <p class="form-description">Enter your credentials to access the console.</p>
                    <div class="form-group">
                        <label for="username-input"></label>
                        <div class="icon">
                            <i class="fa-solid fa-user"></i>
                            <input
                                id="username-input"
                                type="text"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password-input"></label>
                        <div class="icon">
                            <i class="fa-solid fa-lock"></i>

                            <input
                                id="password-input"
                                type="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                        </div>
                    </div>
                    <button type="submit">Access Console</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
